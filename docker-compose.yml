# PocketStudio local infra. Product database is PostgreSQL + pgvector.
# SQLite is not a supported runtime store.
#
#   docker compose up -d postgres
#   cp .env.example .env   # DATABASE_URL already points at this service
#   bunx prisma generate && bun run db:push

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: pocketstudio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: pocketstudio
      POSTGRES_PASSWORD: pocketstudio
      POSTGRES_DB: pocketstudio
    ports:
      - "5432:5432"
    volumes:
      - pocketstudio-pg:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pocketstudio -d pocketstudio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pocketstudio-pg:
